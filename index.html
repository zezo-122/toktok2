<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مشوارك - طلب خدمات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main-color: #5d3fd3; --ph-color: #0ea5e9; --mk-color: #f59e0b; --del-color: #ef4444; --success: #22c55e; --bg: #f4f7f6; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); direction: rtl; padding: 10px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 480px; border-radius: 30px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); min-height: 90vh; border-top: 8px solid var(--main-color); }
        .login-card { text-align: center; padding: 20px 10px; }
        .login-card i { font-size: 60px; color: var(--main-color); margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 15px; border: 2px solid #f0f0f0; border-radius: 15px; font-size: 15px; margin: 10px 0; outline: none; background: #fafafa; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--main-color); background: #fff; }
        .btn-submit { width: 100%; padding: 18px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; background: var(--main-color); color: white; margin-top: 15px; box-shadow: 0 5px 15px rgba(93,63,211,0.3); }
        .user-info { background: #f8f9fa; padding: 12px 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .services-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 2px; border: 2px solid #f0f0f0; border-radius: 12px; background: white; cursor: pointer; font-size: 10px; font-weight: bold; color: #777; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.3s; }
        .tab-btn.active { border-color: var(--main-color); color: var(--main-color); background: #f3f0ff; transform: scale(1.05); }
        .tab-btn i { font-size: 18px; }
        .srv-banner { padding: 15px; border-radius: 20px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .pk-banner { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .price-badge { background: white; padding: 5px 12px; border-radius: 10px; display: inline-block; margin-top: 8px; font-size: 13px; border: 1px dashed #ccc; }
        .order-card { border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 12px; background: #fff; border-right: 6px solid var(--main-color); position: relative; }
        .order-status { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #f3f4f6; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .btn-cancel { background: #fee2e2; color: var(--del-color); border: none; padding: 8px; border-radius: 10px; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <div id="loginSection" class="login-card">
        <i class="fas fa-truck-fast"></i>
        <h2 style="color:var(--main-color); margin-bottom:10px;">مشوارك</h2>
        <input type="tel" id="uPhoneInput" placeholder="رقم موبايلك (11 رقم)" maxlength="11">
        <select id="areaDropdown"><option value="" disabled selected>جاري تحميل المناطق...</option></select>
        <button class="btn-submit" onclick="userLogin()">دخول للتطبيق ✅</button>
    </div>

    <div id="appSection" style="display: none;">
        <div class="user-info">
            <span>📍 منطقة: <b id="displayArea"></b></span>
            <button onclick="logout()" style="border:none; background:none; color:var(--del-color); font-weight:bold; cursor:pointer;">تغيير</button>
        </div>
        
        <div class="services-tabs">
            <button class="tab-btn active" id="btn-mishwar" onclick="openTab('mishwar')"><i class="fas fa-motorcycle"></i>مشوار</button>
            <button class="tab-btn" id="btn-market" onclick="openTab('market')"><i class="fas fa-shopping-basket" style="color:var(--mk-color)"></i>ماركت</button>
            <button class="tab-btn" id="btn-pharma" onclick="openTab('pharma')"><i class="fas fa-pills" style="color:var(--ph-color)"></i>صيدلية</button>
            <button class="tab-btn" id="btn-package" onclick="openTab('package')"><i class="fas fa-box-open" style="color:var(--del-color)"></i>طلب</button>
            <button class="tab-btn" id="btn-orders" onclick="openTab('orders')"><i class="fas fa-receipt"></i>طلباتي</button>
        </div>

        <div id="view-mishwar">
            <div class="srv-banner" style="background:#f3f0ff; color:var(--main-color);">طلب مشوار <br> <span class="price-badge">التكلفة: <span id="mishPriceText">0</span> ج</span></div>
            <input type="text" id="mishFrom" placeholder="نقطة الانطلاق (مثلاً: البيت)">
            <select id="mishTo" onchange="updatePriceBanner('mishTo', 'mishPriceText')"><option value="">رايح فين؟</option></select>
            <button class="btn-submit" onclick="orderMishwar()">اطلب الآن 🚀</button>
        </div>

        <div id="view-market" style="display:none">
            <div class="srv-banner" style="background:#fffbeb; color:#92400e;">توصيل الماركت <br> <span class="price-badge">التوصيل بـ <span id="priceMkText">0</span> ج</span></div>
            <textarea id="mkDetails" rows="3" placeholder="اكتب قائمة المشتريات..."></textarea>
            <input type="text" id="mkAddress" placeholder="عنوانك بالتفصيل">
            <button class="btn-submit" style="background:var(--mk-color)" onclick="orderService('طلب ماركت', 'mkDetails', 'mkAddress', 'priceMkText')">إرسال الطلب 🛒</button>
        </div>

        <div id="view-pharma" style="display:none">
            <div class="srv-banner" style="background:#f0f9ff; color:#0369a1;">توصيل الصيدلية <br> <span class="price-badge">التوصيل بـ <span id="pricePhText">0</span> ج</span></div>
            <textarea id="phDetails" rows="3" placeholder="اكتب أسماء الأدوية..."></textarea>
            <input type="text" id="phAddress" placeholder="عنوانك بالتفصيل">
            <button class="btn-submit" style="background:var(--ph-color)" onclick="orderService('طلب صيدلية', 'phDetails', 'phAddress', 'pricePhText')">طلب الدواء 💊</button>
        </div>

        <div id="view-package" style="display:none">
            <div class="srv-banner pk-banner">نقل الطرود <br> <span class="price-badge">التوصيل بـ <span id="pkPriceText">0</span> ج</span></div>
            <input type="text" id="pkFrom" placeholder="مكان استلام الطرد (مثلاً: من البيت)">
            <input type="tel" id="pkReceiverPhone" placeholder="رقم موبايل المستلم (11 رقم)" maxlength="11">
            <select id="pkTo" onchange="updatePriceBanner('pkTo', 'pkPriceText')">
                <option value="">هيروح فين؟</option>
            </select>
            <button class="btn-submit" style="background:var(--del-color)" onclick="orderPackage()">تأكيد الطرد 📦</button>
        </div>

        <div id="view-orders" style="display:none"><div id="ordersContainer"></div></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCf8_Ks8OC1J8wI5dRKS55GE_KCAO7H-8c", 
        authDomain: "toktok-f5b4a.firebaseapp.com", 
        databaseURL: "https://toktok-f5b4a-default-rtdb.firebaseio.com", 
        projectId: "toktok-f5b4a", 
        storageBucket: "toktok-f5b4a.firebasestorage.app", 
        messagingSenderId: "970149361447", 
        appId: "1:970149361447:web:1922b3d2b797cd26665b02" 
    };
    firebase.initializeApp(firebaseConfig); 
    const db = firebase.database(); 
    let userPhone, userArea;

    db.ref('areas').on('value', snap => { 
        const d = document.getElementById('areaDropdown'); 
        d.innerHTML = '<option value="" disabled selected>اختر منطقتك...</option>'; 
        snap.forEach(c => { d.innerHTML += `<option value="${c.val().name}">${c.val().name}</option>`; }); 
    });

    window.onload = () => { 
        userPhone = localStorage.getItem('user_phone'); 
        userArea = localStorage.getItem('user_area'); 
        if(userPhone && userArea) startApp(); 
    };

    function userLogin() { 
        const p = document.getElementById('uPhoneInput').value, a = document.getElementById('areaDropdown').value; 
        if(p.length < 11 || !a) return alert("أكمل البيانات"); 
        localStorage.setItem('user_phone', p); 
        localStorage.setItem('user_area', a); 
        userPhone = p; userArea = a; startApp(); 
    }

    function startApp() { 
        document.getElementById('loginSection').style.display = 'none'; 
        document.getElementById('appSection').style.display = 'block'; 
        document.getElementById('displayArea').innerText = userArea; 
        syncPricing(); loadOrders(); 
    }

    function updatePriceBanner(selectId, textId) { 
        const s = document.getElementById(selectId); 
        document.getElementById(textId).innerText = s.value || 0; 
    }

    function syncPricing() {
        db.ref(`pricing/${userArea}/destinations`).on('value', snap => { 
            const m = document.getElementById('mishTo'); 
            const p = document.getElementById('pkTo'); 
            let opts = '<option value="">اختر الوجهة...</option>'; 
            snap.forEach(c => { 
                const d = c.val(); 
                opts += `<option value="${d.price}" data-comm="${d.commission}">${d.name}</option>`; 
            }); 
            m.innerHTML = opts; p.innerHTML = opts; 
        });
        db.ref(`pricing/${userArea}`).on('value', snap => { 
            const v = snap.val() || {}; const f = v.fixedPrices || {}; 
            document.getElementById('btn-market').style.display = (f.mkSt !== false) ? 'flex' : 'none'; 
            document.getElementById('btn-pharma').style.display = (f.phSt !== false) ? 'flex' : 'none'; 
            document.getElementById('btn-package').style.display = (f.pkSt !== false) ? 'flex' : 'none'; 
            document.getElementById('priceMkText').innerText = v.market || 0; 
            document.getElementById('pricePhText').innerText = v.pharmacy || 0; 
        });
    }

    function openTab(n) { 
        ['mishwar','market','pharma','package','orders'].forEach(t => { 
            document.getElementById('view-'+t).style.display = (t === n) ? 'block' : 'none'; 
            document.getElementById('btn-'+t).classList.toggle('active', t === n); 
        }); 
    }

    function orderMishwar() { 
        const f = document.getElementById('mishFrom').value, s = document.getElementById('mishTo'); 
        if(!f || !s.value) return alert("أكمل البيانات"); 
        save({ type: 'مشوار', from: f, to: s.options[s.selectedIndex].text, price: s.value, commission: s.options[s.selectedIndex].getAttribute('data-comm') }); 
    }

    function orderService(t, dI, aI, pI) { 
        const d = document.getElementById(dI).value, a = document.getElementById(aI).value, p = document.getElementById(pI).innerText; 
        if(!d || !a) return alert("أكمل البيانات"); 
        save({ type: t, details: d, from: userArea, to: a, price: p, commission: (p * 0.1).toFixed(1) }); 
    }

    function orderPackage() { 
        const f = document.getElementById('pkFrom').value; // مكان الاستلام
        const ph = document.getElementById('pkReceiverPhone').value; 
        const s = document.getElementById('pkTo'); 
        if(!f || ph.length < 11 || !s.value) return alert("أكمل بيانات استلام الطرد"); 
        save({ 
            type: 'طلب طرد', 
            from: f, 
            receiverPhone: ph, 
            to: s.options[s.selectedIndex].text, 
            price: s.value, 
            commission: s.options[s.selectedIndex].getAttribute('data-comm') 
        }); 
    }

    function save(data) { 
        db.ref(`orders/${userArea}`).push({ ...data, phone: userPhone, status: 'pending', time: Date.now() })
        .then(() => { alert("تم الطلب بنجاح ✅"); openTab('orders'); }); 
    }

    function cancelOrder(id) { if(confirm("هل تريد إلغاء الطلب؟")) { db.ref(`orders/${userArea}/${id}`).remove(); } }

    function loadOrders() {
        db.ref(`orders/${userArea}`).orderByChild('phone').equalTo(userPhone).on('value', snap => {
            const container = document.getElementById('ordersContainer'); let html = ''; 
            snap.forEach(s => {
                const o = s.val(); const id = s.key; let statusText = "قيد الانتظار ⏳", actionArea = "";
                if(o.status === 'pending') { 
                    statusText = "قيد الانتظار ⏳"; 
                    actionArea = `<button class="btn-cancel" onclick="cancelOrder('${id}')">إلغاء الطلب ✖</button>`; 
                }
                else if(o.status === 'prepared') statusText = "تم التجهيز وجاري البحث عن كابتن 🚚";
                else if(o.status === 'picked_up') statusText = "الكابتن في الطريق إليك 🛵";
                else if(o.status === 'completed') statusText = "تم التوصيل بنجاح ✅";
                html = `<div class="order-card"><span class="order-status">${statusText}</span><div><b>${o.type}</b><br><small>إلى: ${o.to}</small><br><b style="color:var(--success)">${o.price} ج</b></div>${actionArea}</div>` + html;
            }); 
            container.innerHTML = html || '<p style="text-align:center;color:#999;margin-top:20px;">لا توجد طلبات</p>';
        });
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
